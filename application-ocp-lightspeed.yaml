---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app: ocp-lightspeed
  name: ocp-lightspeed
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    path: components/ocp-lightspeed
    repoURL: https://github.com/dgpmakes/rhoai-gitops.git
    targetRevision: 2.x
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
